# Expected outputs for infant_recon_all processing

# Required directories that must exist in output directory
required_directories:
  - mri
  - mri/transforms
  - surf
  - label
  - stats
  - log
  - work


# Required files organized by directory
# These files MUST exist for validation to pass
required_files:
  # Root directory files
  '.':
    - mprage.nii.gz
  
  # MRI directory - core brain volumes
  mri:
    - aseg.mgz
    - aseg.nii.gz
    - brain.mgz
    - brainmask.mgz
    - norm.mgz
    - norm.nii.gz
    - brain.finalsurfs.mgz
    - filled.mgz
    - wm.mgz
    - aseg.presurf.mgz  # Pre-surface segmentation backup
    - ribbon.mgz
    - lh.ribbon.mgz
    - rh.ribbon.mgz
    - aparc+aseg.mgz    # Combined parcellation and segmentation
  
  # MRI transforms subdirectory
  mri/transforms:
    - talairach.auto.xfm
    - talairach.xfm
  
  # Surface directory - cortical surfaces
  surf:
    - lh.orig
    - lh.white
    - lh.pial
    - lh.sphere
    - lh.inflated
    - lh.area
    - lh.curv
    - rh.orig
    - rh.white
    - rh.pial
    - rh.sphere
    - rh.inflated
    - rh.area
    - rh.curv
  
  # Label directory - cortical labels
  label:
    - lh.cortex.label
    - rh.cortex.label
    - lh.aparc.annot
    - rh.aparc.annot
    - aparc.annot.ctab    # Parcellation color table

  # Stats directory - statistical measurements
  stats:
    - lh.aparc.stats
    - rh.aparc.stats
    - aseg.stats

  # Log directory - processing logs
  log:
    - recon.log